name: Build TWRP (Ultra Minimal)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    
    steps:
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y git-core gnupg flex bison gperf build-essential \
          zip curl zlib1g-dev gcc-multilib g++-multilib libc6-dev-i386 \
          lib32ncurses5-dev x11proto-core-dev libx11-dev lib32z-dev \
          libgl1-mesa-dev libxml2-utils xsltproc unzip fontconfig \
          python2 python3 openjdk-8-jdk \
          bc ccache liblz4-tool libncurses5 libsdl1.2-dev libssl-dev \
          libwxgtk3.0-gtk3-dev lzop pngcrush rsync schedtool squashfs-tools
        
        curl https://storage.googleapis.com/git-repo-downloads/repo > repo
        chmod a+x repo
        sudo mv repo /usr/local/bin/
        sudo ln -sf /usr/bin/python2 /usr/bin/python

    - name: Build
      run: |
        mkdir twrp && cd twrp
        repo init --depth=1 -u https://github.com/minimal-manifest-twrp/platform_manifest_twrp_omni.git -b twrp-6.0
        repo sync -j4 --force-sync --no-clone-bundle --no-tags
        git clone https://github.com/Dekompilyator/twrp_meizu_m5s device/meizu/m5s
        
        # Replace problematic Python files with simple versions
        echo '#!/usr/bin/env python' > build/tools/roomservice.py
        echo 'import sys' >> build/tools/roomservice.py
        echo 'if __name__ == "__main__":' >> build/tools/roomservice.py
        echo '    if len(sys.argv) < 2:' >> build/tools/roomservice.py
        echo '        sys.exit(1)' >> build/tools/roomservice.py
        echo '    print("Device: " + sys.argv[1])' >> build/tools/roomservice.py
        chmod +x build/tools/roomservice.py
        
        # Build
        export JAVA_HOME=/usr/lib/jvm/java-8-openjdk-amd64
        export PATH=$JAVA_HOME/bin:$PATH
        . build/envsetup.sh
        lunch omni_m5s-eng
        make -j$(nproc) hosttools
        mka recoveryimage -j$(nproc)

    - name: Upload
      uses: actions/upload-artifact@v4
      with:
        name: twrp-recovery
        path: twrp/out/target/product/m5s/recovery.img
        retention-days: 30
